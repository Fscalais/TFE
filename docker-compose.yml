services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      CLIENT_URL: "http://localhost:3000"
      API_BASE_URL: "http://localhost:5000"

      MONGO_URI: "mongodb://mongo:27017/tfe"

      JWT_SECRET: "dev-secret-change-me"

      GOOGLE_CLIENT_ID: "dummy"
      GOOGLE_CLIENT_SECRET: "dummy"
      RIOT_API_KEY: "dummy"
      DISCORD_BOT_URL: "http://localhost:3001"
    depends_on:
      - mongo

volumes:
  mongo_data:
